name: Build & Deploy to AWS ECS & ECR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker Images & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build & Push da API ---
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/emissor-fiscal-api-staging:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build & Push do Worker ---
      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/emissor-fiscal-worker-staging:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Atualizar Serviço no ECS Fargate ---
      - name: Deploy to Amazon ECS Fargate
        run: |
          aws ecs update-service \
            --cluster emissor-fiscal-cluster-staging \
            --service emissor-fiscal-api-staging \
            --force-new-deployment \
            --region sa-east-1
